# Mises à jour automatiques des dépendances (R24).
# Chaque lundi, Dependabot ouvre des PR vers dev ; elles passent par les mêmes contrôles que le reste.
# Une version n'est proposée qu'après 7 jours de quarantaine ; les correctifs de sécurité passent sans attendre.
# Le préfixe « chore » respecte le contrôle de titre en Conventional Commits (R5).
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Paris }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: docker
    directory: /scripts/docker
    target-branch: dev
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Paris }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]
