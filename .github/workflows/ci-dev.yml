name: CI — dev

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format · Lint · Build · Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev dbus

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Documentation EN/FR
        run: python3 scripts/check_docs.py

      - name: Générateurs de paquets
        run: python3 -m unittest discover -s src/tests -p 'test*packaging.py'

      - name: Format
        run: cargo fmt --all --check

      - name: Lint (warnings = errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Tests unitaires
        run: cargo test --all-features --locked

      - name: Tray Linux KSNI sans GTK
        timeout-minutes: 2
        run: |
          tree=$(cargo tree --all-features --locked --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(gtk|gtk-sys|libappindicator|proc-macro-error) v'; then
            echo "La chaîne GTK/AppIndicator ne doit pas revenir dans le tray KSNI."
            exit 1
          fi
          dbus-run-session -- cargo test --all-features --locked platform::tray::tests::ksni_creates_menu_and_updates_badge_without_gtk -- --ignored

      - name: Protocole des adaptateurs AT-SPI
        run: dbus-run-session -- python3 scripts/test_dbus_adapters.py --ksni

  supply-chain:
    name: Audit dépendances (vulnérabilités · licences)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Binaires pré-compilés : plus de `cargo install` de plusieurs minutes
      # à chaque exécution (l'ancienne CI `main` réinstallait cargo-audit sans
      # cache à chaque run).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Chaîne D-Bus maintenue
        run: |
          tree=$(cargo tree --all-features --target all --locked --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(zvariant|zvariant_derive|zbus_names) v|^zbus v5[.]'; then
            echo "La chaîne D-Bus retirée ne doit pas revenir dans l'application."
            exit 1
          fi

      - name: Vulnérabilités connues (RUSTSEC)
        run: cargo audit

      - name: Audit complet des dépendances
        run: cargo deny --locked check

  coverage:
    name: Couverture de tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Mesure
        run: cargo llvm-cov --all-features --locked --summary-only

  msrv:
    name: MSRV (rust-version de Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev dbus

      - name: Lire la MSRV déclarée
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Compile avec la MSRV déclarée
        run: cargo check --all-targets --all-features --locked

  minimal-build:
    name: Build minimal (sans GTK ni ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Volontairement aucune dépendance système : c'est tout l'intérêt du
      # test. Si `--no-default-features` réclamait encore GTK, libappindicator
      # ou ALSA, ce job échouerait — et la compatibilité annoncée pour les
      # systèmes minimaux (conteneur, Alpine/musl) serait fausse.
      - name: Dépendances système (clavier/fenêtrage uniquement)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile et teste sans tray ni son
        run: |
          cargo check --all-targets --no-default-features --locked
          cargo test --no-default-features --locked

  e2e-binaries:
    name: Binaire e2e ${{ matrix.name }}
    # Binaires de release pour les tests e2e natifs du laboratoire local (scripts/e2e/run.py) : rien n'est
    # compilé dans les VM. Linux en aarch64 pour les VM ARM64 ; Windows x64, exécuté en émulation sous ARM64.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            built: abcom
            file: abcom-linux-aarch64
          - os: windows-latest
            name: windows-x86_64
            built: abcom.exe
            file: abcom-windows-x86_64.exe
          - os: macos-latest
            name: macos-aarch64
            built: abcom
            file: abcom-macos-aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p e2e
          cp "target/release/${{ matrix.built }}" "e2e/${{ matrix.file }}"

      # Le binaire publié est celui de l'installateur : application graphique, sans console.
      - name: Installateur de release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/check_windows_gui.ps1 -BinaryPath target/release/abcom.exe
          ./scripts/package_windows.ps1 -BinaryPath target/release/abcom.exe
          Copy-Item dist/windows/abcom-windows-x86_64-setup.exe e2e/

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.name }}
          path: e2e/
          retention-days: 7
          if-no-files-found: error

  platform-check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features --locked

      - name: Tests unitaires
        run: cargo test --all-features --locked

      - name: Installation et désinstallation Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo build failed' }
          ./scripts/package_windows.ps1 -BinaryPath target/debug/abcom.exe
          ./scripts/test_windows_package.ps1 -InstallerPath dist/windows/abcom-windows-x86_64-setup.exe

      - name: Bundle macOS signé ad hoc
        if: runner.os == 'macOS'
        run: |
          cargo build --locked
          python3 scripts/package_macos.py target/debug/abcom dist/Abcom.app
          codesign --verify --deep --strict dist/Abcom.app
