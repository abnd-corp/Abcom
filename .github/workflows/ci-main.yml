name: CI — main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  full-check:
    name: Format · Lint · Build · Tests · Intégration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev dbus

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Documentation EN/FR
        run: python3 scripts/check_docs.py

      - name: Format
        run: cargo fmt --all --check

      - name: Lint (warnings = errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Tests unitaires
        run: cargo test --all-features --locked

      - name: Tray Linux KSNI sans GTK
        timeout-minutes: 2
        run: |
          tree=$(cargo tree --all-features --locked --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(gtk|gtk-sys|libappindicator|proc-macro-error) v'; then
            echo "La chaîne GTK/AppIndicator ne doit pas revenir dans le tray KSNI."
            exit 1
          fi
          dbus-run-session -- cargo test --all-features --locked platform::tray::tests::ksni_creates_menu_and_updates_badge_without_gtk -- --ignored

      - name: Tests d'intégration
        run: bash scripts/integration_test.sh

  adapters:
    name: Protocole des adaptateurs AT-SPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: sudo apt-get update && sudo apt-get install -y dbus
      - run: dbus-run-session -- python3 scripts/test_dbus_adapters.py --ksni

  supply-chain:
    name: Audit dépendances (vulnérabilités · licences)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Binaires pré-compilés au lieu d'un `cargo install` non caché.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Chaîne D-Bus maintenue
        run: |
          tree=$(cargo tree --all-features --target all --locked --prefix none)
          if printf '%s\n' "$tree" | grep -E '^(zvariant|zvariant_derive|zbus_names) v|^zbus v5[.]'; then
            echo "La chaîne D-Bus retirée ne doit pas revenir dans l'application."
            exit 1
          fi

      - name: Vulnérabilités connues (RUSTSEC)
        run: cargo audit

      - name: Audit complet des dépendances
        run: cargo deny --locked check

  platform-check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features --locked
