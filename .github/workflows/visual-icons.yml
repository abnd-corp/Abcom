name: Contrôle visuel des icônes
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - examples/check_native_tray.rs
      - scripts/capture_windows_icons.ps1
      - .github/workflows/visual-icons.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-visual-${{ hashFiles('Cargo.lock') }}
      - name: Compiler le diagnostic natif
        run: cargo build --locked --example check_native_tray
      - name: Capturer fenêtre et tray natifs
        shell: pwsh
        run: ./scripts/capture_windows_icons.ps1 -BinaryPath target/debug/examples/check_native_tray.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: icones-windows
          path: dist/visual-icons
