name: Contrôle visuel des icônes
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - examples/check_native_tray.rs
      - scripts/capture_windows_icons.ps1
      - .github/workflows/visual-icons.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-visual-${{ hashFiles('Cargo.lock') }}
      - name: Compiler le diagnostic natif
        run: cargo build --locked --example check_native_tray
      - name: Capturer fenêtre et tray natifs
        shell: pwsh
        run: ./scripts/capture_windows_icons.ps1 -BinaryPath target/debug/examples/check_native_tray.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: icones-windows
          path: dist/visual-icons
