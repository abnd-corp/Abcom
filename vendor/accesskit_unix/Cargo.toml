# Local zbus 6 port; see ../README.md.
[package]
edition = "2024"
rust-version = "1.89"
name = "accesskit_unix"
version = "0.24.1"
authors = ["The AccessKit contributors"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "AccessKit UI accessibility infrastructure: Linux adapter"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "accessibility",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AccessKit/accesskit"

[features]
async-io = [
    "dep:async-channel",
    "dep:async-executor",
    "dep:async-task",
    "dep:futures-util",
]
default = ["async-io"]
tokio = [
    "dep:tokio",
    "dep:tokio-stream",
]

[lib]
name = "accesskit_unix"
path = "src/lib.rs"

[dependencies.accesskit]
version = "0.25.2"

[dependencies.accesskit_atspi_common]
version = "0.21.1"

[dependencies.async-channel]
version = "2.1.1"
optional = true

[dependencies.async-executor]
version = "1.5.0"
optional = true

[dependencies.async-task]
version = "4.3.0"
optional = true

[dependencies.atspi]
version = "0.29"
features = ["proxies"]
default-features = false

[dependencies.futures-lite]
version = "2.3"

[dependencies.futures-util]
version = "0.3.27"
optional = true

[dependencies.serde]
version = "1.0"

[dependencies.tokio]
version = "1.54.1"
features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time",
]
optional = true

[dependencies.tokio-stream]
version = "0.1.19"
optional = true

[dependencies.zbus]
version = "6.2.1"
features = ["default-rt", "proxy", "service"]
default-features = false
